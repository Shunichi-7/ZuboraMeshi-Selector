{% extends "base.html" %} <!-- 全画面で共通して使用するヘッダーを使うため、templatesフォルダのbase.htmlを読み込む -->

{% block title %}
ホーム | ズボラ飯セレクター
{% endblock %}

{% block extra_css %}

<style>

    /* ホーム画面の検索部分全体 */
    .home-content {
        padding: 15px 20px 0;
    }

    /* 説明文 */
    .search-description {
        font-size: 14px;
        margin: 0 0 10px;
    }

    /* 各検索条件 */
    .search-group {
        margin-bottom: 10px;
    }

    /* 【調理時間】など */
    .search-group-title {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 3px;
    }

    /* 選択肢 */
    .search-options {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 12px;
    }

    .search-options label {
        display: flex;
        align-items: center;
        font-size: 14px;
        white-space: nowrap;
    }

    /* チェックボックス */
    .search-options input {
        margin: 0 3px 0 0;
    }

    /* この条件で探す */
    .search-button {
        display: block;
        width: 130px;
        margin: 15px auto 10px;
        padding: 10px 0;
        background: #4285f4;
        color: white;
        border: none;
        font-size: 16px;
        cursor: pointer;
    }

</style>

{% endblock %}

{% block content %}

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <div class="home-content">

        <h2 class="page-title">
            レシピ検索
        </h2>

        <p class="search-description">
        希望条件を選択してレシピを検索しましょう
        </p>

        <form method="get" action="{% url 'recipe_list' %}">

            <!-- 調理時間 -->
            <div class="search-group">

                <div class="search-group-title">
                    【調理時間】
                </div>

                <div class="search-options">

                    <label>
                        <input type="checkbox" name="cooking_time" value="10">
                        10分以内
                    </label>

                    <label>
                        <input type="checkbox" name="cooking_time" value="20">
                        20分以内
                    </label>

                </div>

            </div>


            <!-- 材料数 -->
            <div class="search-group">

                <div class="search-group-title">
                    【材料数】
                </div>

                <div class="search-options">

                    <label>
                        <input type="checkbox" name="ingredient_count" value="3">
                        3つ以内
                    </label>

                    <label>
                        <input type="checkbox" name="ingredient_count" value="5">
                        5つ以内
                    </label>

                </div>

            </div>


            <!-- 1食あたりの金額 -->
            <div class="search-group">

                <div class="search-group-title">
                    【1食あたりの金額】
                </div>

                <div class="search-options">

                    <label>
                        <input type="checkbox" name="price" value="300">
                        300円以下
                    </label>

                    <label>
                        <input type="checkbox" name="price" value="500">
                        500円以下
                    </label>

                </div>

            </div>


            <!-- 気分タグ -->
            <div class="search-group">

                <div class="search-group-title">
                    【気分タグ】
                </div>

                <div class="search-options">

                    <label>
                        <input type="checkbox" name="mood" value="疲れている">
                        疲れている
                    </label>

                    <label>
                        <input type="checkbox" name="mood" value="ガッツリ">
                        ガッツリ
                    </label>

                    <label>
                        <input type="checkbox" name="mood" value="さっぱり">
                        さっぱり
                    </label>

                    <label>
                        <input type="checkbox" name="mood" value="とにかくうまい">
                        とにかくうまい
                    </label>

                </div>

            </div>


            <!-- ズボラ条件 -->
            <div class="search-group">

                <div class="search-group-title">
                    【ズボラ条件】
                </div>

                <div class="search-options">

                    <label>
                        <input type="checkbox" name="zubora" value="包丁不要">
                        包丁不要
                    </label>

                    <label>
                        <input type="checkbox" name="zubora" value="ワンパン">
                        ワンパン
                    </label>

                    <label>
                        <input type="checkbox" name="zubora" value="レンチン">
                        レンチン
                    </label>

                    <label>
                        <input type="checkbox" name="zubora" value="炊飯器">
                        炊飯器
                    </label>

                    <label>
                        <input type="checkbox" name="zubora" value="作り置き">
                        作り置き
                    </label>

                </div>

            </div>


            <!-- 選択した条件でレシピ検索結果画面へ移動する -->
            <button
                type="submit"
                class="search-button"
                data-processing-text="検索中…"
            >
                この条件で探す
            </button>

        </form>

    </div>

{% endblock %}

</body>

</html>
