{% extends "base.html" %}

{% block title %}
ログイン | ズボラ飯セレクター
{% endblock %}


{% block extra_css %}

<style>

    /* ログイン画面全体 */
    .login-content {
        padding: 20px 35px 40px;
    }

    /* メールアドレス・パスワードのまとまり */
    .login-form-group {
        margin-bottom: 25px;
    }

    /* 入力項目の名前 */
    .login-form-group label {
        display: block;
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    /* メールアドレス・パスワード入力欄 */
    .login-form-group input {
        width: 100%;
        height: 40px;
        padding: 6px 10px;
        border: 1px solid #999;
        box-sizing: border-box;
        font-size: 16px;
    }

    /* ログインボタンを中央に配置 */
    .login-button-area {
        text-align: center;
        margin: 30px 0 25px;
    }

    /* 青いログインボタン */
    .login-button {
        width: 130px;
        padding: 10px 0;
        background: #4285f4;
        color: white;
        border: none;
        font-size: 16px;
        cursor: pointer;
    }

    /* アカウント登録・パスワード再設定 */
    .login-link {
        margin: 10px 0;
        font-size: 15px;
        text-align: center;
    }

    .login-link a {
        color: #4285f4;
    }

    /* ログイン失敗時のエラーメッセージ */
    .login-error {
        color: red;
        text-align: center;
        font-size: 14px;
        margin-top: 10px;
    }

</style>

{% endblock %}


{% block content %}

<div class="login-content">

    <h2 class="page-title page-title-center">
        ログイン
    </h2>

    <!-- ここからログイン情報を入力・送信する範囲 -->
    <form method="post">

        <!--
        このWebサイトの正しい画面から送信されたことを確認し、
        外部サイトなどからの不正な送信（CSRF攻撃）を防ぐ
        -->
        {% csrf_token %}

        <!-- メールアドレス -->
        <div class="login-form-group">

            <label for="email">
                メールアドレス
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

        </div>

        <!-- パスワード -->
        <div class="login-form-group">

            <label for="password">
                パスワード
            </label>

            <input
                type="password"
                id="password"
                name="password"
                type="password"
            >

        </div>

        <!-- ログインボタン -->
        <div class="login-button-area">

            <button
                type="submit"
                class="login-button"
            >
                ログイン
            </button>

        </div>

        {% if error_message %}
            <p class="login-error">
                {{ error_message }}
            </p>
        {% endif %} 
    </form>


    <p class="login-link">
        アカウント登録は
        <a href="{% url 'signup' %}">
            こちら
        </a>
    </p>

    <p class="login-link">
        パスワードを忘れた方は
        <a href="{% url 'password_reset' %}">
            こちら
        </a>
    </p>

</div>

{% endblock %}

{% block bottom_nav %}
{% endblock %}
